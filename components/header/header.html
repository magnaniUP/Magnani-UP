<!-- ====================================================================
     COMPONENTE MODULAR: HEADER MAGNANI UP®
     Reutilizável nas versões: /pt/, /br/, /it/
     ==================================================================== -->
<header class="site-header" id="site-header">
  <div class="header-container">
    
    <!-- Lado Esquerdo: Logo Magnani UP® -->
    <a href="{{HOME_URL}}" class="brand-logo" aria-label="{{LOGO_LABEL}}">
      <span class="brand-logo-content">
        <svg class="brand-symbol-svg" viewBox="0 0 56 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="{{GRAD_ID_M}}" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#7045f5"/>
              <stop offset="50%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
            <linearGradient id="{{GRAD_ID_UP}}" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="70%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#ede9fe"/>
            </linearGradient>
          </defs>
          <path d="M 4 29 L 10.8 9.5 C 11.8 6.8 14.8 6.8 15.8 9.5 L 20 18.5 C 21 20.8 23.8 20.8 24.8 18.5 L 29 9.5 C 30 6.8 33 6.8 34 9.5 L 38.5 20 C 39.2 21.8 41.5 22 42.5 20.5 L 46 14.5" 
                stroke="url(#{{GRAD_ID_M}})" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 33.5 17.5 L 36.8 28.5 C 37.8 31.8 41.8 31.8 42.8 28.5 L 51.5 5.5 C 52 4.2 50.8 3.2 49.2 3.2 L 44 3.2 C 42.2 3.2 41 4.5 40.2 6.2 L 38 11" 
                stroke="url(#{{GRAD_ID_UP}})" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">
          <span class="brand-name-main">Magnani</span>
          <span class="brand-name-up">UP</span>
          <sup class="brand-registered">®</sup>
        </span>
      </span>
    </a>

    <!-- Centro: Menu de Navegação Desktop -->
    <nav class="site-nav" id="main-nav" aria-label="{{NAV_LABEL}}">
      <ul class="nav-list">
        {{NAV_ITEMS}}
      </ul>
    </nav>

    <!-- Lado Direito: Botão CTA Laranja e Hamburger Mobile -->
    <div class="header-actions">
      <a href="{{CTA_URL}}" class="btn-cta">
        <span>{{CTA_TEXT}}</span>
        <svg class="cta-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M6 3.5L10.5 8L6 12.5"/>
        </svg>
      </a>

      <button type="button" 
              class="hamburger-btn" 
              id="hamburger-toggle" 
              aria-expanded="false" 
              aria-controls="mobile-drawer" 
              aria-label="{{MENU_TOGGLE_LABEL}}">
        <span class="hamburger-box">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </span>
      </button>
    </div>

  </div>
</header>
